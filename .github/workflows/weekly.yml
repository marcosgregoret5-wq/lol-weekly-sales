name: Weekly LoL Sales

on:
  schedule:
    - cron: "*/15 19-23 * * 1"
    - cron: "*/15 0-2 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python send_sales_reddit.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

      - name: Save sent Reddit post
        run: |
          test -f .last_reddit_sale.txt || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .last_reddit_sale.txt
          git diff --cached --quiet || git commit -m "Update last sent Reddit sale"
          git push
